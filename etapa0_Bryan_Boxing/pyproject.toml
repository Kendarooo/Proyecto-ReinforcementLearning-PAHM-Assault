[project]
name = "etapa0-bryan-boxing"
version = "1.0.0"
description = "Etapa 0 - DQN Individual - Boxing Atari | EL5857 Aprendizaje Automático"
requires-python = "==3.11.*"

dependencies = [
    "stable-baselines3[extra]>=2.3.0",
    "gymnasium[atari]>=0.29.1",
    "ale-py[roms]>=0.9.0",
    "wandb>=0.17.0",
    "torch>=2.2.0",
    "numpy>=1.26.0",
    "opencv-python>=4.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]