program: train.py
method: bayes
metric:
  name: eval/mean_reward
  goal: maximize
parameters:
  agent.learning_rate:
    values: [0.00006, 0.0001, 0.00018, 0.00025, 0.00035]
  agent.epsilon_decay_steps:
    values: [100000, 150000, 250000, 300000, 500000]
  agent.epsilon_end:
    values: [0.01, 0.03, 0.05, 0.08, 0.1]
  agent.target_update_freq:
    values: [500, 1000, 2500, 5000]
  agent.gamma:
    values: [0.99, 0.995, 0.997]
  agent.batch_size:
    values: [32, 64]
  training.n_episodes:
    value: 120
  training.eval_every:
    value: 20
  training.eval_episodes:
    value: 5
  training.checkpoint_every:
    value: 40
command:
  - ${env}
  - python
  - ${program}
  - --config
  - config.json
