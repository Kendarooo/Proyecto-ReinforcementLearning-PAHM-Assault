program: train.py
method: grid
metric:
  name: eval/mean_reward
  goal: maximize
parameters:
  sweep_profile:
    values:
      - base_short
      - fast_learning
      - more_exploration
      - quick_exploitation
      - long_horizon
command:
  - ${env}
  - python
  - ${program}
  - --config
  - config.json
