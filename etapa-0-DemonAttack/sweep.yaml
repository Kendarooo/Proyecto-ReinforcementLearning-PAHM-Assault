program: train.py
method: random
metric:
  name: eval/mean_reward
  goal: maximize
parameters:
  agent.learning_rate:
    values: [0.00003, 0.00006, 0.0001, 0.00018, 0.00035, 0.0006]
  agent.epsilon_decay_steps:
    values: [100000, 150000, 250000, 300000, 500000, 800000]
  agent.epsilon_end:
    values: [0.01, 0.05, 0.1]
  agent.target_update_freq:
    values: [500, 1000, 2500, 5000, 10000]
  agent.gamma:
    values: [0.99, 0.995, 0.997]
  agent.batch_size:
    values: [32, 64]
  training.n_episodes:
    value: 100
  training.eval_every:
    value: 20
  training.eval_episodes:
    value: 3
  training.checkpoint_every:
    value: 25
command:
  - ${env}
  - python
  - ${program}
  - --config
  - config.json
